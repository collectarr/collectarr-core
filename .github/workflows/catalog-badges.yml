name: Catalog Badges

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The badges live on their own branch, so a daily count needs no review on main.
      - uses: actions/checkout@v7
        with:
          ref: catalog-badges
          path: published-badges

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Generate badges
        env:
          COLLECTARR_BADGES_BASE_URL: ${{ secrets.COLLECTARR_BADGES_BASE_URL }}
          COLLECTARR_BADGES_TOKEN: ${{ secrets.COLLECTARR_BADGES_TOKEN }}
          COLLECTARR_BADGES_EMAIL: ${{ secrets.COLLECTARR_BADGES_EMAIL }}
          COLLECTARR_BADGES_PASSWORD: ${{ secrets.COLLECTARR_BADGES_PASSWORD }}
          COLLECTARR_BADGES_PASSWORD_B64: ${{ secrets.COLLECTARR_BADGES_PASSWORD_B64 }}
        run: python scripts/generate_catalog_badges.py --output-dir published-badges

      - name: Publish changed counts
        working-directory: published-badges
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: refresh catalog badges"
          git push
