name: collectarr

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${API_PYTHON_BASE_IMAGE:-python:3.14-slim}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    env_file: .env
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - .:/app
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      seaweedfs:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${API_PYTHON_BASE_IMAGE:-python:3.14-slim}
    command: python -m app.worker.main
    env_file: .env
    restart: unless-stopped
    volumes:
      - .:/app
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      seaweedfs:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    command:
      - postgres
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_checkpoints=off
    environment:
      POSTGRES_DB: collectarr
      POSTGRES_USER: collectarr
      POSTGRES_PASSWORD: collectarr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collectarr -d collectarr"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  meilisearch:
    image: ${MEILI_IMAGE:-getmeili/meilisearch:v1.13}
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: collectarr-dev-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    logging: *default-logging

  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.38@sha256:e1ee85a3089d96c4f3df699a0944468557813f5df306819c9d368c4039070ddf}
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -ip=seaweedfs
      - -s3.port=9000
      - -s3.port.iceberg=0
      - -webdav=false
      - -admin.user=${S3_ACCESS_KEY_ID:-collectarr}
      - -admin.password=${S3_SECRET_ACCESS_KEY:-collectarr-dev-secret}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-collectarr}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-collectarr-dev-secret}
    ports:
      - "9000:9000"
      - "9001:23646"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

volumes:
  postgres_data:
  meili_data:
  seaweedfs_data:
