name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install package
        run: pip install -e .[dev]
      - name: Run schema and contract tests without PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://collectarr:collectarr@localhost:1/collectarr_test
          SECRET_KEY: test-secret
          ENVIRONMENT: test
        run: python -m pytest -m "not db" --cov=app --cov-report=xml:coverage-fast.xml
      - name: Save informational fast coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-fast-coverage
          path: coverage-fast.xml
          if-no-files-found: warn

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: collectarr_test
          POSTGRES_USER: collectarr
          POSTGRES_PASSWORD: collectarr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collectarr -d collectarr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Verify generated docs are current
        run: |
          python -m scripts.export_schema_site
          python -m scripts.export_openapi
          git diff --exit-code -- docs/schema-data.json docs/schema-full.md docs/openapi.json

      - name: Verify versioned contract bundle is current
        run: python -m scripts.export_contract_bundle --check

      - name: Type check (informational)
        continue-on-error: true
        run: python -m mypy app

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://collectarr:collectarr@localhost:5432/collectarr_test
          SECRET_KEY: test-secret
          ENVIRONMENT: test
        run: python -m pytest -m db --cov=app --cov-report=xml:coverage-db.xml
      - name: Save informational database coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-database-coverage
          path: coverage-db.xml
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare Compose env
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config --quiet
